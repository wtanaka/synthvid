# Fat LTO plus a single codegen unit gives the optimizer visibility across
# the whole dependency graph, including into every checked_add/checked_mul
# this workspace's own type-safety rules require throughout its hot paths
# (JPEG encoding above all): a call in one codegen unit can be inlined and
# have its overflow branch proven dead from a caller's known value range in
# a different unit, which the default (16 codegen units, no LTO) profile
# cannot see across. Measured close to a third faster end to end on the
# corpus generator with no source change and no lint suppressed.
[profile.release]
lto = "fat"
codegen-units = 1
