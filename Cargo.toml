[workspace]
resolver = "2"
members = [
    "crates/synthvid-scene",
    "crates/synthvid-encode",
    "crates/synthvid-video",
    "crates/synthvid-catalog",
    "crates/synthvid-validate",
    "crates/synthvid-cli",
    "crates/synthvid-testkit",
]

[workspace.package]
version = "0.0.1-alpha.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wtanaka/synthvid"
readme = "README.md"
keywords = ["video", "deterministic", "synthetic", "generator"]
categories = ["multimedia::video", "command-line-utilities"]

# Every member inherits this with `[lints] workspace = true`. The table is
# digest-guarded, so weakening it is a visible, reviewable change rather than a
# quiet one.
#
# `#[allow]` is itself denied below. Use `#[expect(lint, reason = "...")]`
# instead: it carries a written justification and fails the build once the
# underlying lint stops firing, so a suppression cannot outlive its cause.
# Each `#[expect]` also needs a row in .unrepresentable/ledger.md.

[workspace.lints.rust]
# Cannot be overridden by any attribute, anywhere.
unsafe_code = "forbid"

future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
let_underscore = { level = "deny", priority = -1 }

absolute_paths_not_starting_with_crate = "deny"
deprecated_in_future = "deny"
elided_lifetimes_in_paths = "deny"
explicit_outlives_requirements = "deny"
ffi_unwind_calls = "deny"
keyword_idents = { level = "deny", priority = -1 }
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
missing_abi = "deny"
missing_copy_implementations = "deny"
missing_debug_implementations = "deny"
missing_docs = "deny"
non_ascii_idents = "deny"
noop_method_call = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
unreachable_pub = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unused_qualifications = "deny"

# Every remaining rustc lint, so none is left at its default level. Lints
