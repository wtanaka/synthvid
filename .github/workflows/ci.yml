name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  BUDGET_BASE: origin/main

# Every cargo invocation below builds --release and --locked. --release:
# this workspace's own type-safety rules (checked arithmetic everywhere, no
# raw indexing) are expensive without optimization and nearly free with it,
# and only ever building one profile also means only one profile's worth of
# artifacts lands in the target directory. --locked: fail rather than
# silently update Cargo.lock if it and Cargo.toml ever drift.

# Caching policy. Only things that are slow to obtain or compile are cached:
# downloaded packages, the pinned toolchain and the unrepresentable binary.
# Cargo's target directory is deliberately not cached: the project has no
# external dependencies, and a fresh checkout gives every source file a new
# modification time, so cargo would rebuild the workspace's own crates anyway
# and the cache would only spend the repository's cache budget. Nothing that
# proves a result is cached: test runs,
# lint verdicts, and the regenerated corpus are always produced fresh, so a
# cache can make a run faster but can never make a failure disappear.

jobs:
  # Both architectures run the identical job. The corpus job below runs
  # alongside this one.
  check:
    name: check (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      # fetch-depth: 0 pulls full history for every branch, so origin/main
      # (the base check-budgets-ratchet.sh diffs against) is resolvable even
      # when this run is building a different branch or a pull request.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Saves downloading the pinned toolchain (rust-toolchain.toml, with
      # rustfmt and clippy) on every run. The runner image ships other
      # toolchains but not this one. The version is read from
      # rust-toolchain.toml, the one place it is written, and the key is the
      # toolchain file, so a pin change is a fresh download.
      - name: Read the pinned toolchain version
        run: echo "RUST_TOOLCHAIN=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_ENV"

      - name: Restore the pinned toolchain
        uses: actions/cache@v6
        with:
          path: ~/.rustup/toolchains/${{ env.RUST_TOOLCHAIN }}-*
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Install the toolchain
        run: |
          rustup toolchain install
          rustc -Vv

      # Saves downloading the .deb files on every run. Only package archives
      # are cached, never the package index. The key is the runner image
      # version, because the package versions (and so the .deb files) change
      # with each image. apt checks every cached .deb against its index hash
      # and downloads any that do not match, so a stale entry costs a download
      # and never installs the wrong package.
      # ImageVersion is an environment variable of the runner's operating
      # system, not part of the workflow's env context, so it has to be
      # copied there before a cache key can use it.
      - name: Read the runner image version
        run: echo "RUNNER_IMAGE_VERSION=$ImageVersion" >> "$GITHUB_ENV"

      - name: Restore external decoder packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_IMAGE_VERSION }}

      - name: Install external JPEG decoder tools
        run: |
          archives="$RUNNER_TEMP/apt-archives"
          mkdir -p "$archives/partial"
          sudo chmod 1777 "$archives" "$archives/partial"
          install() {
            sudo apt-get install -y -o Dir::Cache::archives="$archives" libjpeg-turbo-progs python3-pil
          }
          # The image's package lists are usually current enough to install
          # from; refresh them only when that fails.
          install || { sudo apt-get update && install; }
          # apt ran as root: hand the archive back so the cache step can read it.
          sudo chown -R "$(id -u):$(id -g)" "$archives"

      # ci/check-all.sh runs fmt, clippy, tests and rustdoc, each in its own
      # freshly emptied target directory. The workflow does not repeat them as
      # separate steps, because that would do the same work twice.
      - name: Repository guards
        run: sh ci/check-all.sh

  # Each architecture regenerates the whole corpus from scratch and verifies it
  # against the committed catalog.lock, so if both pass they necessarily
  # produced identical bytes. No artifact passing is needed. This job runs in
  # parallel with check.
  corpus:
    name: corpus (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same pinned-toolchain cache as the check job; see the note there.
      - name: Read the pinned toolchain version
        run: echo "RUST_TOOLCHAIN=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_ENV"

      - name: Restore the pinned toolchain
        uses: actions/cache@v6
        with:
          path: ~/.rustup/toolchains/${{ env.RUST_TOOLCHAIN }}-*
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Install the toolchain
        run: |
          rustup toolchain install
          rustc -Vv

      # Same apt archive cache as the check job; see the note there. The key
      # is the same, so the two jobs share one cache entry.
      # ImageVersion is an environment variable of the runner's operating
      # system, not part of the workflow's env context, so it has to be
      # copied there before a cache key can use it.
      - name: Read the runner image version
        run: echo "RUNNER_IMAGE_VERSION=$ImageVersion" >> "$GITHUB_ENV"

      - name: Restore external decoder packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_IMAGE_VERSION }}

      # Everything in this job tests the claim the project exists to make: the
      # corpus is regenerated from scratch and must match the committed digests
      # byte for byte.
      - name: Generate the corpus
        if: hashFiles('catalog.lock') != ''
        run: cargo run --release --locked -p synthvid-cli -- generate --out "$RUNNER_TEMP/corpus"

      # verify reads the lockfile from inside the corpus directory, and
      # generate does not write one, so place the committed lockfile there.
      - name: Verify the corpus against the committed digests
        if: hashFiles('catalog.lock') != ''
        run: |
          cp catalog.lock "$RUNNER_TEMP/corpus/catalog.lock"
          cargo run --release --locked -p synthvid-cli -- verify --corpus "$RUNNER_TEMP/corpus"

      # An external decoder is permitted for verification only; it is never
      # used to produce a file. This is what confirms the containers are
      # readable by software that did not write them. The ffmpeg archives go
      # into the same cache directory as the packages above.
      - name: Install an external decoder
        if: hashFiles('catalog.lock') != ''
        run: |
          archives="$RUNNER_TEMP/apt-archives"
          mkdir -p "$archives/partial"
          sudo chmod 1777 "$archives" "$archives/partial"
          install() {
            sudo apt-get install -y -o Dir::Cache::archives="$archives" ffmpeg
          }
          install || { sudo apt-get update && install; }
          # apt ran as root: hand the archive back so the cache step can read it.
          sudo chown -R "$(id -u):$(id -g)" "$archives"

      - name: Confirm the corpus is externally decodable
        if: hashFiles('catalog.lock') != ''
        run: sh ci/check-externally-decodable.sh "$RUNNER_TEMP/corpus"

  # Rejects code whose types and signatures admit invalid states. Its facts
  # and recorded exceptions are in .unrepresentable/; the baseline there may
  # only shrink. Exit 3 means the change touches that configuration and needs a
  # human decision, so it fails this job on purpose. It is a job of its own so
  # that such a change leaves every job above green. The result does not depend
  # on the architecture, so it runs once.
  unrepresentable:
    name: unrepresentable
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 so that origin/main, the base of the change range, is
      # resolvable whichever branch or pull request is being built.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same pinned-toolchain cache as the check job; see the note there.
      - name: Read the pinned toolchain version
        run: echo "RUST_TOOLCHAIN=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_ENV"

      - name: Restore the pinned toolchain
        uses: actions/cache@v6
        with:
          path: ~/.rustup/toolchains/${{ env.RUST_TOOLCHAIN }}-*
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Install the toolchain
        run: |
          rustup toolchain install
          rustc -Vv

      # Saves compiling unrepresentable from source, which is the slowest part
      # of this job. The key holds everything the built binary depends on: the
      # pinned version (repeated from the install command below, so update both
      # together), the architecture, and the toolchain that compiled it. A hit
      # skips only the compile. The binary still runs in the step after this.
      - name: Restore unrepresentable
        id: unrepresentable-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/unrepresentable
          key: unrepresentable-${{ runner.os }}-${{ runner.arch }}-0.0.1-alpha.1-${{ hashFiles('rust-toolchain.toml') }}

      - name: Install unrepresentable
        if: steps.unrepresentable-cache.outputs.cache-hit != 'true'
        run: cargo install unrepresentable --locked --version =0.0.1-alpha.1

      - name: Unrepresentable
        run: |
          unrepresentable self-test
          unrepresentable check --against "$BUDGET_BASE" .
          unrepresentable canaries .
