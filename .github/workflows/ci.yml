name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  BUDGET_BASE: origin/main

# Every cargo invocation below builds --release and --locked. --release:
# this workspace's own type-safety rules (checked arithmetic everywhere, no
# raw indexing) are expensive without optimization and nearly free with it,
# and only ever building one profile also means only one profile's worth of
# artifacts lands in the target directory. --locked: fail rather than
# silently update Cargo.lock if it and Cargo.toml ever drift.

jobs:
  # Both architectures run the identical job. Cross-architecture reproducibility
  # is proved transitively: each one regenerates the whole corpus from scratch
  # and verifies it against the committed catalog.lock, so if both pass they
  # necessarily produced identical bytes. No artifact passing is needed.
  check:
    name: check (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      # fetch-depth: 0 pulls full history for every branch, so origin/main
      # (the base check-budgets-ratchet.sh diffs against) is resolvable even
      # when this run is building a different branch or a pull request.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the toolchain
        run: |
          rustup toolchain install
          rustc -Vv

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --release --locked --all-targets --all-features -- -D warnings

      - name: Install external JPEG decoder tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-turbo-progs python3-pil

      - name: Repository guards
        run: sh ci/check-all.sh

      - name: Tests
        run: cargo test --release --locked --all

      - name: Documentation
        run: cargo doc --release --locked --no-deps --all
        env:
          RUSTDOCFLAGS: -D warnings

      # Everything above this line tests the code. Everything below tests the
      # claim the project exists to make: the corpus is regenerated from
      # scratch and must match the committed digests byte for byte.
      - name: Generate the corpus
        if: hashFiles('catalog.lock') != ''
        run: cargo run --release --locked -p synthvid-cli -- generate --out "$RUNNER_TEMP/corpus"

      # verify reads the lockfile from inside the corpus directory, and
      # generate does not write one, so place the committed lockfile there.
      - name: Verify the corpus against the committed digests
        if: hashFiles('catalog.lock') != ''
        run: |
          cp catalog.lock "$RUNNER_TEMP/corpus/catalog.lock"
          cargo run --release --locked -p synthvid-cli -- verify --corpus "$RUNNER_TEMP/corpus"

      # An external decoder is permitted for verification only; it is never
      # used to produce a file. This is what confirms the containers are
      # readable by software that did not write them.
      - name: Install an external decoder
        if: hashFiles('catalog.lock') != ''
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Confirm the corpus is externally decodable
        if: hashFiles('catalog.lock') != ''
        run: sh ci/check-externally-decodable.sh "$RUNNER_TEMP/corpus"
